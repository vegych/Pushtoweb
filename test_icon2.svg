<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background: Discord Blurple & Samsung Internet Beta gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6572F8" />
      <stop offset="45%" stop-color="#5865F2" />
      <stop offset="100%" stop-color="#454EC0" />
    </linearGradient>

    <!-- Subtle plush cushion radial lighting -->
    <radialGradient id="plushLight" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15" />
    </radialGradient>

    <!-- Soft pillow drop-shadow for envelope onto purple cushion -->
    <filter id="softPlushShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1B1746" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B1746" flood-opacity="0.25" />
    </filter>

    <!-- Flap shadow onto envelope body -->
    <filter id="flapShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#312E81" flood-opacity="0.28" />
    </filter>

    <linearGradient id="envelopeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F4F5FB" />
    </linearGradient>

    <linearGradient id="flapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E8ECFA" />
    </linearGradient>
  </defs>

  <!-- Squircle Base with Soft Pillowy Curve & Bevel -->
  <rect x="36" y="36" width="440" height="440" rx="108" fill="url(#bgGrad)" />
  <rect x="36" y="36" width="440" height="440" rx="108" fill="url(#plushLight)" />
  <rect x="38" y="38" width="436" height="436" rx="106" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.22" />

  <!-- Tactile White Envelope (Значок письма) -->
  <g filter="url(#softPlushShadow)">
    <!-- Envelope Main Body -->
    <rect x="106" y="156" width="300" height="204" rx="30" fill="url(#envelopeGrad)" />

    <!-- Bottom fold diagonal accents -->
    <path d="M 116 348 L 220 262" fill="none" stroke="#5865F2" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.65" />
    <path d="M 396 348 L 292 262" fill="none" stroke="#5865F2" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.65" />

    <!-- Top Flap with 3D drop shadow -->
    <path d="M 112 164 C 112 158 116 156 124 156 L 388 156 C 396 156 400 158 400 164 L 263 274 C 259 277 253 277 249 274 Z"
          fill="url(#flapGrad)"
          filter="url(#flapShadow)" />

    <!-- Flap Outline for crystal-clear definition at small sizes -->
    <path d="M 114 162 L 252 272 C 254.5 274 257.5 274 260 272 L 398 162"
          fill="none"
          stroke="#5865F2"
          stroke-width="12"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>
</svg>
