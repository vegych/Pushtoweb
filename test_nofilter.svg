<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Discord / Internet Beta Violet Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6472F8" />
      <stop offset="45%" stop-color="#5865F2" />
      <stop offset="100%" stop-color="#454EC0" />
    </linearGradient>

    <!-- Top soft lighting -->
    <radialGradient id="softLight" cx="50%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.16" />
    </radialGradient>

    <!-- Envelope Body Gradient -->
    <linearGradient id="envelopeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2F4FA" />
    </linearGradient>

    <!-- Flap Shading -->
    <linearGradient id="flapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E7EBF8" />
    </linearGradient>
  </defs>

  <!-- Squircle Base (Discord Violet) -->
  <rect x="36" y="36" width="440" height="440" rx="108" fill="url(#bgGrad)" />
  <rect x="36" y="36" width="440" height="440" rx="108" fill="url(#softLight)" />
  <rect x="38" y="38" width="436" height="436" rx="106" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.2" />

  <!-- Manual Drop Shadow (100% compatible with ALL SVG engines & librsvg) -->
  <rect x="106" y="168" width="300" height="204" rx="30" fill="#1B1746" fill-opacity="0.38" />

  <!-- White Mail Envelope Main Body (Значок письма) -->
  <rect x="106" y="156" width="300" height="204" rx="28" fill="url(#envelopeGrad)" />

  <!-- Bottom fold diagonal accents -->
  <path d="M 116 348 L 220 262"
        fill="none"
        stroke="#5865F2"
        stroke-width="12"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-opacity="0.75" />
  <path d="M 396 348 L 292 262"
        fill="none"
        stroke="#5865F2"
        stroke-width="12"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-opacity="0.75" />

  <!-- Flap shadow cast onto lower envelope -->
  <path d="M 114 164 L 256 280 L 398 164 Z" fill="#262362" fill-opacity="0.22" />

  <!-- Top Flap (folded down V-shape) -->
  <path d="M 112 164 C 112 158 116 156 124 156 L 388 156 C 396 156 400 158 400 164 L 263 274 C 259 277 253 277 249 274 Z"
        fill="url(#flapGrad)" />

  <!-- Top Flap Crisp Fold Outline -->
  <path d="M 114 162 L 252 272 C 254.5 274 257.5 274 260 272 L 398 162"
        fill="none"
        stroke="#5865F2"
        stroke-width="12"
        stroke-linecap="round"
        stroke-linejoin="round" />
</svg>
