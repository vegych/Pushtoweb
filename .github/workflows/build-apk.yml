name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build PushToWeb APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Determine Version Name
        id: get_version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VER="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="1.0.0"
          fi
          echo "APP_VERSION=$VER" >> $GITHUB_ENV
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Resolved version: $VER"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease -PversionName="${{ env.APP_VERSION }}" || ./gradlew assembleDebug -PversionName="${{ env.APP_VERSION }}"

      - name: Locate and Package APK with SHA256 Checksum
        id: package_apk
        run: |
          mkdir -p build_output
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            TARGET_APK="build_output/PushToWeb-${{ env.APP_VERSION }}.apk"
            echo "Packaging APK: $APK_FILE -> $TARGET_APK"
            cp "$APK_FILE" "$TARGET_APK"
            cd build_output
            sha256sum "PushToWeb-${{ env.APP_VERSION }}.apk" > "PushToWeb-${{ env.APP_VERSION }}.apk.sha256"
            cd ..
            echo "apk_path=$TARGET_APK" >> $GITHUB_OUTPUT
          else
            echo "Error: No APK file generated!"
            exit 1
          fi

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PushToWeb-${{ env.APP_VERSION }}-APK
          path: |
            build_output/PushToWeb-${{ env.APP_VERSION }}.apk
            build_output/PushToWeb-${{ env.APP_VERSION }}.apk.sha256
          retention-days: 90

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          name: PushToWeb v${{ env.APP_VERSION }}
          tag_name: ${{ github.ref_name }}
          files: |
            build_output/PushToWeb-${{ env.APP_VERSION }}.apk
            build_output/PushToWeb-${{ env.APP_VERSION }}.apk.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
