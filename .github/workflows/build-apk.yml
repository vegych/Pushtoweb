name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build PushToWeb APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Determine Version and Release Tag
        id: get_version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VER="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            BASE_VER="1.0"
            if grep -q 'versionName' android/app/build.gradle.kts; then
              EXTRACTED=$(grep 'versionName' android/app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
              if [[ "$EXTRACTED" =~ ^([0-9]+\.[0-9]+) ]]; then
                BASE_VER="${BASH_REMATCH[1]}"
              fi
            fi
            VER="${BASE_VER}.${{ github.run_number }}"
          fi

          TAG="v$VER"
          echo "APP_VERSION=$VER" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG" >> $GITHUB_ENV
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Determined release: $TAG (version: $VER, run: ${{ github.run_number }})"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web App Offline Assets
        run: |
          npm install --legacy-peer-deps
          npm run build
          mkdir -p android/app/src/main/assets/web
          cp -r dist/* android/app/src/main/assets/web/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure Gradle Wrapper exists
        run: |
          cd android
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing, generating via Gradle CLI..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Generate or Ensure Fixed Release Signing Key
        run: |
          mkdir -p android/app
          if [ ! -f android/app/release.jks ]; then
            echo "Generating persistent release keystore..."
            $JAVA_HOME/bin/keytool -genkeypair -v \
              -keystore android/app/release.jks \
              -alias pushtoweb \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass pushtowebpass -keypass pushtowebpass \
              -dname "CN=PushToWeb, OU=App, O=PushToWeb, L=City, ST=State, C=RU"
          fi

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleRelease -PversionName="${{ env.APP_VERSION }}" -PversionCode="${{ github.run_number }}" --stacktrace

      - name: Locate and Package APK with SHA256 Checksum
        id: package_apk
        run: |
          mkdir -p build_output
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            TARGET_APK="build_output/PushToWeb-${{ env.APP_VERSION }}.apk"
            echo "Packaging APK: $APK_FILE -> $TARGET_APK"
            cp "$APK_FILE" "$TARGET_APK"
            cd build_output
            sha256sum "PushToWeb-${{ env.APP_VERSION }}.apk" > "PushToWeb-${{ env.APP_VERSION }}.apk.sha256"
            cd ..
            echo "apk_path=$TARGET_APK" >> $GITHUB_OUTPUT
          else
            echo "Error: No APK file generated!"
            exit 1
          fi

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PushToWeb-${{ env.APP_VERSION }}-APK
          path: |
            build_output/PushToWeb-${{ env.APP_VERSION }}.apk
            build_output/PushToWeb-${{ env.APP_VERSION }}.apk.sha256
          retention-days: 90

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: PushToWeb v${{ env.APP_VERSION }}
          tag_name: ${{ env.TAG_NAME }}
          files: |
            build_output/PushToWeb-${{ env.APP_VERSION }}.apk
            build_output/PushToWeb-${{ env.APP_VERSION }}.apk.sha256
          body: |
            ## 🚀 Релиз PushToWeb v${{ env.APP_VERSION }}

            Автономный шлюз и центр управления пересылкой SMS и push-уведомлений приложений в Telegram.

            ### 📦 Загрузка
            - **Android APK**: `PushToWeb-${{ env.APP_VERSION }}.apk`
            - **Контрольная сумма**: см. `PushToWeb-${{ env.APP_VERSION }}.apk.sha256`

            ### 📋 Изменения
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
